<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="770" viewBox="0 0 1440 770"
     role="img" aria-labelledby="title description">
  <title id="title">Tela inicial do portfólio de Julia Vexel</title>
  <desc id="description">Tela de notebook clara, com apresentação de Julia, navegação e botões visuais de contato.</desc>

  <defs>
    <linearGradient id="frame-stroke" x1="24" y1="20" x2="1416" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="card-stroke" x1="145" y1="115" x2="1295" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="primary-button" x1="405" y1="445" x2="655" y2="517" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#8B2CF5"/>
    </linearGradient>

    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="20" flood-color="#4338CA" flood-opacity="0.10"/>
    </filter>

    <filter id="button-shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6D28D9" flood-opacity="0.20"/>
    </filter>

    <clipPath id="screen-content">
      <path d="M25 68H1415V731Q1415 750 1396 750H44Q25 750 25 731Z"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne+Mono&amp;display=swap');

      .mono {
        font-family: "Syne Mono", "Courier New", monospace;
      }

      .button,
      .contact-button {
        transition: transform 160ms ease, filter 160ms ease;
        transform-box: fill-box;
        transform-origin: center;
        cursor: pointer;
      }

      .button:hover {
        transform: translateY(-3px);
        filter: url(#button-shadow);
      }

      .contact-button:hover {
        transform: translateY(-2px);
      }
    </style>
  </defs>

  <!-- Fundo externo -->
  <rect width="1440" height="770" fill="#EEF0F4"/>

  <!-- Moldura de notebook/navegador -->
  <rect x="25" y="20" width="1390" height="730" rx="18" fill="#F7F8FA" stroke="#CBD3DF" stroke-width="2"/>
  <path d="M25 68H1415" stroke="#D8DEE8" stroke-width="2"/>

  <!-- Controles da barra superior -->
  <circle cx="58" cy="44" r="6" fill="#F97316"/>
  <circle cx="80" cy="44" r="6" fill="#7C3AED"/>
  <circle cx="102" cy="44" r="6" fill="#2563EB"/>
  <rect x="608" y="34" width="224" height="19" rx="9.5" fill="#E3E6EB"/>

  <!-- Área interna da página -->
  <g clip-path="url(#screen-content)">
    <rect x="25" y="68" width="1390" height="682" fill="#F5F1FA"/>

    <!-- Moldura interna preservada -->
    <rect x="145" y="112" width="1150" height="585" rx="28"
          fill="#FFFFFF" fill-opacity="0.60"
          stroke="url(#card-stroke)" stroke-width="2.3"
          filter="url(#card-shadow)"/>

    <!-- Conteúdo -->
    <g class="mono">
      <text x="300" y="196" font-size="24" fill="#6B7280" opacity="0.78">// olá, mundo!</text>

      <text x="300" y="275" font-size="48" letter-spacing="0.3">
        <tspan fill="#2563EB">Muito prazer, eu sou a </tspan>
        <tspan fill="#F97316">Julia.</tspan>
      </text>

      <text x="300" y="337" font-size="46" letter-spacing="0.3">
        <tspan fill="#111C45">Esse é o </tspan>
        <tspan fill="#2563EB">meu </tspan>
        <tspan fill="#7C3AED">portfólio.</tspan>
      </text>

      <text x="300" y="406" font-size="23" fill="#F97316">
        Saiba mais sobre mim e dê uma olhada nos meus projetos.
      </text>

      <!-- Navegação -->
      <a href="tela_sobre.html" xlink:href="tela_sobre.html" aria-label="Abrir página Sobre">
        <g class="button">
          <rect x="405" y="449" width="250" height="72" rx="14" fill="url(#primary-button)" filter="url(#button-shadow)"/>
          <text x="451" y="495" font-size="27" fill="#FFFFFF">sobre()</text>
          <path d="M593 484H625M613 472L625 484L613 496" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </a>

      <a href="tela_projetos.html" xlink:href="tela_projetos.html" aria-label="Abrir página Projetos">
        <g class="button">
          <rect x="690" y="449" width="270" height="72" rx="14" fill="#FFFFFF" fill-opacity="0.50" stroke="#2563EB" stroke-width="2.2"/>
          <text x="730" y="495" font-size="27" fill="#2563EB">projetos[]</text>
          <path d="M902 484H932M920 472L932 484L920 496" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </a>

      <!-- Contato: botões visuais compactos, sem links -->
      <text x="500" y="614" font-size="22" fill="#6B7280">contate-me()</text>

      <g class="contact-button">
        <rect x="690" y="574" width="58" height="58" rx="13" fill="#EEF4FF" stroke="#2563EB" stroke-width="1.8"/>
        <text x="707" y="613" font-size="28" fill="#2563EB">@</text>
      </g>

      <g class="contact-button">
        <rect x="768" y="574" width="58" height="58" rx="13" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.8"/>
        <text x="782" y="612" font-size="24" fill="#7C3AED">in</text>
      </g>

      <g class="contact-button">
        <rect x="846" y="574" width="58" height="58" rx="13" fill="#FFF3E9" stroke="#F97316" stroke-width="1.8"/>
        <text x="853" y="611" font-size="21" fill="#F97316">&lt;/&gt;</text>
      </g>
    </g>
  </g>

  <!-- Contorno final da tela -->
  <rect x="25" y="20" width="1390" height="730" rx="18" fill="none" stroke="url(#frame-stroke)" stroke-width="1.5" opacity="0.55"/>
</svg>
