<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | Julia Vexel</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tela_inicio.css">
</head>

<body>
    <div class="notebook ligado" id="notebook">
        <div class="moldura-monitor">
            <div class="tela-notebook">
                <main class="apresentacao">
                    <section class="cumprimento">
                        <p class="ola">// olá, mundo!</p>

                        <h1>
                            Muito prazer, eu sou a
                            <span class="nome">Julia</span>
                        </h1>

                        <h2>
                            e esse é o
                            <span class="meu">meu</span>
                            <span class="portifolio">portfólio.</span>
                        </h2>

                        <p class="convite">
                            Saiba mais sobre mim e dê uma olhada nos meus projetos.
                        </p>
                    </section>

                    <nav class="navegacao">
                        <a href="tela_sobre.html" class="sobre">
                            sobre()
                        </a>

                        <a href="tela_projetos.html" class="projetos">
                            projetos[]
                        </a>
                    </nav>

                    <section class="contatos">
                        <p class="contato">contate-me:</p>

                        <div class="botoes-contato">
                            <a
                                class="lkdn"
                                href="https://www.linkedin.com/in/julia-v-03b73325b/"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Abrir LinkedIn"
                            >
                                <img src="imagens/linkedin.png" alt="">
                            </a>

                            <a
                                class="email"
                                href="mailto:jucvfontes@icloud.com"
                                aria-label="Enviar e-mail"
                            >
                                <img src="imagens/email.png" alt="">
                            </a>

                            <a
                                class="github"
                                href="https://github.com/juliacvf"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Abrir GitHub"
                            >
                                <img src="imagens/github.png" alt="">
                            </a>
                        </div>
                    </section>
                </main>

                <div class="tela-apagada" aria-hidden="true"></div>
                <div class="clarao" aria-hidden="true"></div>
            </div>

            <div class="controles-monitor">
                <span class="luz-status" aria-hidden="true"></span>

                <button
                    class="botao-ligar"
                    id="botao-ligar"
                    type="button"
                    aria-label="Desligar notebook"
                    aria-pressed="true"
                >
                    <span aria-hidden="true">⏻</span>
                </button>
            </div>
        </div>

        <div class="base-notebook"></div>
    </div>

    <script src="tela_home.js"></script>
</body>
</html>
